# Development-only project file. MaiBot does not read this: runtime dependencies
# are declared in _manifest.json and installed by the MaiBot host.
[project]
name = "maibot-telegram-full"
version = "0.2.0"
description = "Telethon based full-featured Telegram adapter for MaiBot"
requires-python = ">=3.10"
dependencies = [
    "maibot-plugin-sdk>=2.8.1,<3",
    "telethon>=1.45,<2",  # layer 229: KeyboardInlineButton (inline keyboards)
    "cryptg>=0.4",
    "Pillow>=9.0",
    "aiohttp>=3.8",
    "markdown-it-py>=3.0",
    "python-socks>=2.4",
    "av>=12",  # GIF conversion; the wheels bundle ffmpeg
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
